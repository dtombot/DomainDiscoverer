name: Reconcile dev lockfile and verify site
on:
  push:
    branches: [dev]
permissions:
  contents: write
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Reconcile pre-existing stale lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify reproducible install
        run: npm ci --no-audit --no-fund
      - name: Validate article links
        run: npm run check:content
      - name: Build static website
        run: npm run build
      - name: Commit corrected lockfile to dev only
        if: success()
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Repair pre-existing npm lockfile mismatch"
            git push origin HEAD:dev
          fi
